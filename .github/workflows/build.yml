name: Build Sharingan Evolution Addon

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify project and Narutoto dependency
        run: |
          test -f build.gradle
          test -f libs/narutoto-0.4.2-forge-1.20.1.jar
          test -f .github/workflows/build.yml

      - name: Build addon
        run: gradle --no-daemon clean build

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sharingan-Evolution-Addon-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
